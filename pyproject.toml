[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-ssm-lm"
version = "0.1.0"
description = "A reproducible, decoder-only selective SSM language model experiment."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "tokenizers>=0.19,<1",
  "datasets>=2.19,<4",
]

[project.scripts]
sslm-download-data = "data.download_data:main"
sslm-prepare-data = "data.prepare_data:main"
sslm-train-tokenizer = "data.train_tokenizer:main"
sslm-tokenize-data = "data.tokenize_data:main"
sslm-prepare-sft = "data.prepare_sft:main"
sslm-merge-raw = "data.merge_raw:main"
sslm-train = "training.train:main"
sslm-evaluate = "training.evaluate:main"
sslm-sft = "training.sft:main"
sslm-generate = "inference.generate:main"
sslm-chat = "inference.chat:main"

[project.optional-dependencies]
cpu = ["torch>=2.2,<2.8"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
