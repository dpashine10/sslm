# Optional SFT configuration. Start from a base checkpoint and an SFT JSONL
# generated by src.data.prepare_sft.
seed: 1234
device: auto
precision: auto
output_dir: outputs/checkpoints/sft
pretrained_checkpoint: outputs/checkpoints/base_50m/best.pt
sft_data: data/processed/sft

training:
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 1000
  learning_rate: 0.00003
  weight_decay: 0.01
  warmup_steps: 50
  gradient_clip_norm: 1.0
  log_interval_steps: 10
  checkpoint_interval_steps: 100
  keep_checkpoints: 2
